<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz | HOROQUEST</title>
<meta name="description" content="Ten questions to test your watch culture, with an explanation for every answer.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HOROQUEST">
<meta property="og:title" content="Quiz | HOROQUEST">
<meta property="og:description" content="Ten questions to test your watch culture, with an explanation for every answer.">
<meta property="og:url" content="https://horoquest.app/en/jeu/">
<meta property="og:image" content="https://horoquest.app/assets/horace-512.png">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../assets/styles.css?v=10">
<style>
  .rubis-reveal { margin: 0 0 24px; }
  .rubis-gain { display: inline-flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 700; color: var(--ink); font-feature-settings: "tnum" 1; }
  .rubis-gem { width: 24px; height: 24px; flex: none; display: inline-block; line-height: 0; transform-origin: center; }
  .rubis-gem svg { width: 100%; height: 100%; display: block; }
  .rubis-gem.sparkle { animation: rubisPop .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes rubisPop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
  .rubis-total { display: block; font-size: 14px; color: var(--ink-soft); margin-top: 5px; }
  .rank-reveal { margin: -4px 0 22px; }
  .rank-status { font-size: 13px; color: var(--ink-soft); }
  .rank-promo { margin: 0 0 14px; padding: 16px; border-left: 2px solid var(--accent); background: var(--bg-soft); text-align: center; }
  .rank-promo::before { content: ''; display: block; width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 10px; background: url('../../assets/horace-512.png') center / cover; box-shadow: var(--shadow-sm); }
  .rank-promo .rank-quote { display: block; font-style: italic; font-size: 16px; line-height: 1.5; color: var(--ink); }
  .rank-promo .rank-by { display: block; margin-top: 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .ranked-up .rank-promo { animation: rankIn .5s ease both; }
  @keyframes rankIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="quiz-page">

<header class="quiz-header">
  <div class="container">
    <a class="quiz-back" id="backLink" href="../collections/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="backName">Collection</span>
    </a>
    <a class="quiz-close" href="/en/" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </a>
  </div>
  <div class="quiz-progress" aria-hidden="true"><div class="bar" id="progBar" style="width:0%;"></div></div>
</header>

<main class="quiz-main">
  <div class="container">
    <div id="loading" style="text-align:center;padding:60px 0;color:var(--ink-soft);">
      Loading questions…
    </div>
    <div id="quizContent" hidden>
      <div class="q-num">Question <strong id="qNum">1</strong>/10</div>
      <h1 class="q-text" id="qText"></h1>
      <div class="q-image" id="qImage" hidden></div>
      <div class="answers" id="answers"></div>
      <div class="explain" id="explain" hidden></div>
      <div class="next-row" id="nextRow" hidden>
        <button class="btn btn-primary" id="nextBtn">Next question →</button>
      </div>
    </div>
    <div id="quizEnd" hidden>
      <div class="result-layout">
        <div class="result-image" id="resultImage"></div>
        <div class="result-body">
          <div class="result-eyebrow" id="resultEyebrow">Quiz complete</div>
          <div class="result-label">Your score</div>
          <div class="score"><span id="finalScore">0</span><span class="max">/10</span></div>
          <div class="score-label" id="scoreLabel"></div>
          <div class="rubis-reveal" id="rubisReveal" hidden>
            <span class="rubis-gain">
              <span class="rubis-gem" aria-hidden="true"></span>
              +<span id="rubisGain">0</span> rubies
            </span>
            <span class="rubis-total" id="rubisTotalLine"></span>
          </div>
          <div class="rank-reveal" id="rankReveal" hidden>
            <div class="rank-promo" id="rankPromo" hidden></div>
            <div class="rank-gauge">
              <div class="rank-gauge-head"><span class="rank-now" id="rankNow"></span><span class="rank-next" id="rankNext"></span></div>
              <div class="rank-bar"><span class="rank-bar-fill" id="rankBarFill"></span></div>
              <div class="rank-foot" id="rankFoot"></div>
            </div>
            <a class="btn btn-ghost hq-card-link" href="/en/card/" style="margin-top:14px;">View my member card</a>
          </div>
          <div class="result-avg" id="resultAvg"></div>
          <div class="result-actions">
            <button class="btn btn-ghost result-share" id="shareBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              Share my result
            </button>
          </div>
          <div class="result-buttons">
            <button class="btn btn-primary" onclick="location.reload()">Play again</button>
            <a href="/en/" class="btn btn-ghost">Back to collections</a>
          </div>
        </div>
      </div>
      <div class="next-quiz-banner" id="nextQuiz" hidden>
        <div class="next-quiz-thumb" id="nextQuizThumb"></div>
        <div class="next-quiz-text">
          <span class="next-quiz-label">Next quiz</span>
          <strong id="nextQuizName"></strong>
        </div>
        <a href="#" class="next-quiz-arrow" id="nextQuizLink">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </div>
      <div class="email-capture" id="emailCapture" hidden>
        <div class="email-capture-inner">
          <div class="email-capture-text">
            <strong>A new quiz in your inbox</strong>
            <p>Join the enthusiasts who get a quiz and a watch story. No spam.</p>
          </div>
          <form class="email-capture-form" id="emailForm" novalidate>
            <input type="email" id="emailInput" name="email" placeholder="you@email.com" required autocomplete="email">
            <button type="submit" class="btn btn-primary" id="emailSubmit">Sign me up</button>
          </form>
          <div class="email-capture-note" id="emailNote">By subscribing, you agree to receive our emails. <a href="/privacy.html" style="color:inherit;text-decoration:underline;">Privacy</a>.</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../../assets/quest.js?v=3"></script>
<script>
const SUPABASE_URL = 'https://bqnawfnkukcbqkujsskr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxbmF3Zm5rdWtjYnFrdWpzc2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1ODQ5NDAsImV4cCI6MjA4NzE2MDk0MH0.VeSr_1gEnsn3P0_cmQBcOkJNDpUe1rbIAD8E7nSbxQM';
const headers = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

// MailerLite: group "Horoquest EN subscribers", form "Capture page résultat EN"
const ML_ACCOUNT = '2398064';
const ML_FORM = '189114013441852559';

const params = new URLSearchParams(location.search);
const slug = params.get('slug') || 'rolex';

let questions = [];
let current = 0;
let score = 0;
let correctQuestions = [];
let themeName = '';
let themeImage = '';
let nextTheme = null;

async function init() {
  const tRes = await fetch(`${SUPABASE_URL}/rest/v1/themes?select=name_en,name,filter_value,slug,image_url,sort_order&slug=eq.${slug}`, { headers });
  const themes = await tRes.json();
  if (themes.length) {
    const theme = themes[0];
    themeName = theme.name_en || theme.name;
    themeImage = theme.image_url || '';
    document.title = themeName + ' Quiz | HOROQUEST';
    document.getElementById('backName').textContent = themeName;
    document.getElementById('backLink').href = '../collections/?slug=' + theme.slug;
    document.getElementById('resultEyebrow').textContent = 'Quiz complete · ' + themeName;

    const nRes = await fetch(`${SUPABASE_URL}/rest/v1/themes?select=name_en,name,slug,image_url&is_active=eq.true&sort_order=gt.${theme.sort_order}&order=sort_order&limit=1`, { headers });
    const nextThemes = await nRes.json();
    if (nextThemes.length) {
      nextTheme = nextThemes[0];
    } else {
      const firstRes = await fetch(`${SUPABASE_URL}/rest/v1/themes?select=name_en,name,slug,image_url&is_active=eq.true&slug=neq.${slug}&order=sort_order&limit=1`, { headers });
      const firsts = await firstRes.json();
      if (firsts.length) nextTheme = firsts[0];
    }

    await fetchQuestions(theme.filter_value);
  } else {
    await fetchQuestions(null);
  }
}

async function fetchQuestions(filterValue) {
  try {
    let url = `${SUPABASE_URL}/rest/v1/questions?select=id,text_en,text,explanation_en,explanation,difficulty,image_url,answers(id,text_en,text,is_correct)`;
    if (filterValue) url += `&theme_slugs=cs.{${filterValue}}`;
    url += '&limit=100';
    const res = await fetch(url, { headers });
    let data = await res.json();
    if (!Array.isArray(data)) throw new Error('Invalid response');
    data = data.filter(q => q.answers && q.answers.length === 4);
    for (let i = data.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [data[i], data[j]] = [data[j], data[i]];
    }
    questions = data.slice(0, 10);
    if (questions.length === 0) throw new Error('No questions for this theme');
    showQuestion();
  } catch (e) {
    document.getElementById('loading').textContent = 'No questions available for this theme.';
    console.error(e);
  }
}

function showQuestion() {
  document.getElementById('loading').hidden = true;
  document.getElementById('quizContent').hidden = false;
  document.getElementById('quizEnd').hidden = true;

  const q = questions[current];
  document.getElementById('qNum').textContent = current + 1;
  document.getElementById('qText').textContent = q.text_en || q.text;
  const qImg = document.getElementById('qImage');
  if (q.image_url) {
    qImg.hidden = false;
    qImg.innerHTML = `<img src="${q.image_url}" alt="">`;
  } else {
    qImg.hidden = true;
    qImg.innerHTML = '';
  }
  document.getElementById('progBar').style.width = ((current) / questions.length * 100) + '%';
  const explain = document.getElementById('explain');
  explain.hidden = true;
  explain.classList.remove('visible');
  document.getElementById('nextRow').hidden = true;

  const answersDiv = document.getElementById('answers');
  const letters = ['A', 'B', 'C', 'D'];
  const shuffled = [...q.answers];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  answersDiv.innerHTML = shuffled.map((a, i) => `
    <button class="answer" data-i="${i}" data-correct="${a.is_correct}">
      <span class="letter">${letters[i]}</span>
      <span>${a.text_en || a.text}</span>
    </button>
  `).join('');

  answersDiv.querySelectorAll('.answer').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(btn));
  });
}

function handleAnswer(btn) {
  const buttons = document.querySelectorAll('.answer');
  if (btn.disabled) return;
  buttons.forEach(b => b.disabled = true);

  const isCorrect = btn.dataset.correct === 'true';
  let correctBtn = null;

  if (isCorrect) {
    btn.classList.add('correct');
    correctBtn = btn;
    score++;
    correctQuestions.push(questions[current]);
  } else {
    btn.classList.add('incorrect');
    buttons.forEach(b => {
      if (b.dataset.correct === 'true') {
        b.classList.add('reveal-correct');
        correctBtn = b;
      }
    });
  }

  const q = questions[current];

  if (correctBtn) {
    if (!isCorrect) {
      const wrongText = btn.querySelector('span:not(.letter)').textContent;
      const wrongDiv = document.createElement('div');
      wrongDiv.className = 'answer-wrong-recall';
      wrongDiv.innerHTML = '<span class="wrong-label">Your answer</span>' + wrongText;
      correctBtn.insertBefore(wrongDiv, correctBtn.querySelector('.letter').nextSibling);
    }
    const explanation = q.explanation_en || q.explanation;
    if (explanation) {
      const explainDiv = document.createElement('div');
      explainDiv.className = 'answer-explain';
      explainDiv.textContent = explanation;
      correctBtn.appendChild(explainDiv);
    }
  }

  setTimeout(() => {
    buttons.forEach(b => {
      if (b !== correctBtn) b.classList.add('fade-out');
    });
    correctBtn.classList.add('expanded');

    setTimeout(() => {
      const inner = correctBtn.querySelector('.answer-explain');
      if (inner) inner.classList.add('show');
      document.getElementById('nextRow').hidden = false;
    }, 300);
  }, 500);

  document.getElementById('progBar').style.width = ((current + 1) / questions.length * 100) + '%';
}

document.getElementById('nextBtn').addEventListener('click', () => {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
});

function showResult() {
  document.getElementById('quizContent').hidden = true;
  document.getElementById('quizEnd').hidden = false;
  document.getElementById('finalScore').textContent = score;
  const pct = score / questions.length;
  const label = pct >= 0.9 ? 'Nailed it!' :
                pct >= 0.7 ? 'Sharp eye' :
                pct >= 0.5 ? 'Well played' :
                pct >= 0.3 ? 'Not bad for a start' : 'It\'s all ahead of you';
  document.getElementById('scoreLabel').textContent = label;

  // Rubies (Phase 1): compute, accumulate, and record mastery for the hallmarks
  const rubisGain = HQ.computeRubis(correctQuestions, questions.length);
  const rubisBefore = HQ.getRubis();
  const rubisTotal = HQ.addRubis(rubisGain);
  HQ.recordMastery(slug, correctQuestions.map(q => q.id));
  revealRubis(rubisGain, rubisTotal);
  revealRank(rubisBefore, rubisTotal);

  if (themeImage) {
    document.getElementById('resultImage').innerHTML = `<img src="${themeImage}" alt="${themeName}">`;
  }

  saveScore();
  fetchAverage();

  if (nextTheme) {
    const nq = document.getElementById('nextQuiz');
    nq.hidden = false;
    document.getElementById('nextQuizName').textContent = nextTheme.name_en || nextTheme.name;
    document.getElementById('nextQuizLink').href = '?slug=' + nextTheme.slug;
    if (nextTheme.image_url) {
      document.getElementById('nextQuizThumb').innerHTML = `<img src="${nextTheme.image_url}" alt="${nextTheme.name_en || nextTheme.name}">`;
    }
  }

  showEmailCapture();

  async function saveScore() {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          correct_count: score,
          total_questions: questions.length,
          theme_slug: slug,
          mode: 'collection',
          score: score * 100
        })
      });
    } catch(e) {}
  }

  async function fetchAverage() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=correct_count,total_questions&theme_slug=eq.${slug}`, { headers });
      const scores = await res.json();
      if (Array.isArray(scores) && scores.length > 0) {
        const avg = scores.reduce((sum, s) => sum + (s.correct_count / s.total_questions) * 100, 0) / scores.length;
        document.getElementById('resultAvg').textContent =
          `Average success rate: ${avg.toFixed(1)}% across ${scores.length} enthusiast${scores.length > 1 ? 's' : ''}.`;
      }
    } catch(e) {}
  }

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const text = `${themeName} · ${score}/${questions.length} on HOROQUEST!`;
    if (navigator.share) {
      try { await navigator.share({ title: 'HOROQUEST', text, url: location.href }); } catch(e) {}
    } else {
      await navigator.clipboard.writeText(text + ' ' + location.href);
    }
  });
}

function revealRubis(gain, total) {
  const box = document.getElementById('rubisReveal');
  if (!box) return;
  box.hidden = false;
  const totalLine = document.getElementById('rubisTotalLine');
  if (totalLine) totalLine.textContent = 'Total ' + total.toLocaleString('en-US') + ' rubies';
  const gainEl = document.getElementById('rubisGain');
  const dur = 800, t0 = performance.now();
  (function tick(now) {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    gainEl.textContent = Math.round(eased * gain);
    if (p < 1) requestAnimationFrame(tick);
    else gainEl.textContent = gain;
  })(performance.now());
  const gem = box.querySelector('.rubis-gem');
  if (gem) { gem.innerHTML = HQ.gem; gem.classList.remove('sparkle'); void gem.offsetWidth; gem.classList.add('sparkle'); }
}

function revealRank(before, after) {
  const box = document.getElementById('rankReveal');
  if (!box) return;
  box.hidden = false;
  const info = HQ.rankInfo(after);
  const up = HQ.rankUp(before, after);
  const promo = document.getElementById('rankPromo');
  if (up) {
    box.classList.add('ranked-up');
    promo.hidden = false;
    promo.innerHTML = '<span class="rank-quote">' + up.line_en + '</span><span class="rank-by">Maître Horace</span>';
  } else {
    box.classList.remove('ranked-up');
    promo.hidden = true;
  }
  document.getElementById('rankNow').textContent = info.name_en;
  const fill = document.getElementById('rankBarFill');
  let pct;
  if (info.isMax) {
    document.getElementById('rankNext').textContent = 'Keeper of Time';
    document.getElementById('rankFoot').textContent = 'Top rank · the 20 hallmarks lead to Keeper of Time';
    pct = 100;
  } else {
    document.getElementById('rankNext').textContent = info.next_en;
    document.getElementById('rankFoot').textContent = info.toNext.toLocaleString('en-US') + ' rubies to ' + info.next_en;
    pct = Math.max(5, Math.round((after - info.min) / (info.nextMin - info.min) * 100));
  }
  requestAnimationFrame(function () { requestAnimationFrame(function () { fill.style.width = pct + '%'; }); });
}

function showEmailCapture() {
  if (ML_ACCOUNT === 'XXXXXX') return;          // not configured yet
  if (localStorage.getItem('hq_sub')) return;   // already subscribed
  const box = document.getElementById('emailCapture');
  if (box) box.hidden = false;
}

const emailForm = document.getElementById('emailForm');
if (emailForm) {
  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('emailInput');
    const btn = document.getElementById('emailSubmit');
    const note = document.getElementById('emailNote');
    const email = input.value.trim();
    if (!email || !email.includes('@')) { note.textContent = 'Enter a valid address.'; return; }
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const data = new FormData();
      data.append('fields[email]', email);
      data.append('ml-submit', '1');
      data.append('anticsrf', 'true');
      await fetch(`https://assets.mailerlite.com/jsonp/${ML_ACCOUNT}/forms/${ML_FORM}/subscribe`, { method: 'POST', body: data });
      localStorage.setItem('hq_sub', '1');
      document.querySelector('#emailCapture .email-capture-inner').innerHTML =
        '<div class="email-capture-success">You\'re in. Keep an eye on your inbox.</div>';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Sign me up';
      note.textContent = 'Something went wrong, try again.';
    }
  });
}

init();
</script>
</body>
</html>
