/* --- Daily challenge: specific styles --- */
.daily-eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.streak-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; color: var(--ink);
  background: var(--card); border: 1px solid var(--border-strong);
  padding: 5px 12px; line-height: 1;
}
.streak-badge .flame { width: 15px; height: 15px; color: var(--accent); }
.daily-grid { display: flex; gap: 8px; justify-content: center; margin: 14px 0 18px; }
.daily-grid .cell { width: 34px; height: 34px; }
.daily-grid .cell.ok { background: var(--good); }
.daily-grid .cell.no { background: var(--accent); }
.daily-streak { color: var(--ink-soft); margin: 4px 0 2px; }
.daily-streak strong { color: var(--ink); }
.daily-next {
  margin: 24px auto 4px; max-width: 320px; text-align: center;
  border-top: 1px solid var(--border); padding-top: 20px;
}
.daily-countdown-label { font-size: 13px; color: var(--ink-soft); letter-spacing: .04em; }
.daily-countdown { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
.daily-locked-note { color: var(--ink-soft); font-size: 14px; margin: 4px 0 0; }
/* Clean centering of result actions (centered column) */
#quizEnd .result-actions,
#quizEnd .result-buttons { justify-content: center; }
#quizEnd .result-actions { margin-bottom: 0; }
.rubis-reveal { margin: 2px 0 18px; }
.rubis-gain { display: inline-flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 700; color: var(--ink); font-feature-settings: "tnum" 1; }
.rubis-gem { width: 24px; height: 24px; flex: none; display: inline-block; line-height: 0; transform-origin: center; }
.rubis-gem svg { width: 100%; height: 100%; display: block; }
.rubis-gem.sparkle { animation: rubisPop .7s cubic-bezier(.2,.8,.2,1); }
@keyframes rubisPop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
.rubis-total { display: block; font-size: 14px; color: var(--ink-soft); margin-top: 5px; }
.rank-reveal { margin: -2px 0 18px; }
.rank-status { font-size: 13px; color: var(--ink-soft); }
.rank-promo { margin: 0 auto 14px; max-width: 420px; padding: 16px; border-left: 2px solid var(--accent); background: var(--bg-soft); text-align: center; }
.rank-promo::before { content: ''; display: block; width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 10px; background: url('../../assets/horace-512.png') center / cover; box-shadow: var(--shadow-sm); }
.rank-promo .rank-quote { display: block; font-style: italic; font-size: 16px; line-height: 1.5; color: var(--ink); }
.rank-promo .rank-by { display: block; margin-top: 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.ranked-up .rank-promo { animation: rankIn .5s ease both; }
@keyframes rankIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>

<script>
const SUPABASE_URL = 'https://bqnawfnkukcbqkujsskr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxbmF3Zm5rdWtjYnFrdWpzc2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1ODQ5NDAsImV4cCI6MjA4NzE2MDk0MH0.VeSr_1gEnsn3P0_cmQBcOkJNDpUe1rbIAD8E7nSbxQM';
const headers = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

const DAILY_COUNT = 5;
const STORE_KEY = 'hq_daily';

// MailerLite: "Passionnés Horoquest" group, EN result-page form
const ML_ACCOUNT = '2398064';
const ML_FORM = '189114013441852559';

// Today's date in Paris time, YYYY-MM-DD (same challenge for everyone, shared with the FR page)
function parisDate(d) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
}
const todayStr = parisDate();
const dateLabel = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', day: 'numeric', month: 'long' }).format(new Date());

// Deterministic pseudo-random generator (same draw for a given date)
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rnd) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function readStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e) { return {}; } }
function writeStore(o) { try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch(e) {} }

let questions = [];
let current = 0;
let results = [];
const store = readStore();

// Streak badge in the header
if (store.streak > 0 && store.lastPlayed) {
  const yesterday = parisDate(new Date(Date.now() - 86400000));
  if (store.lastPlayed === todayStr || store.lastPlayed === yesterday) {
    document.getElementById('streakBadge').hidden = false;
    document.getElementById('streakBadgeNum').textContent = store.streak;
  }
}

async function init() {
  // Already played today: show the locked result
  if (store.today && store.today.date === todayStr) {
    results = store.today.results;
    renderResult(store.today.score, store.streak || 1, store.best || 1, true, store.today.rubis, HQ.getRubis(), HQ.getRubis());
    return;
  }
  try {
    const url = `${SUPABASE_URL}/rest/v1/questions?select=id,text_en,text,explanation_en,explanation,difficulty,image_url,theme_slugs,answers(id,text_en,text,is_correct)&order=id&limit=1000`;
    const res = await fetch(url, { headers });
    let data = await res.json();
    if (!Array.isArray(data)) throw new Error('Invalid response');
    data = data.filter(q => q.answers && q.answers.length === 4 && q.answers.some(a => a.is_correct));
    if (data.length < DAILY_COUNT) throw new Error('Not enough questions');

    const rnd = mulberry32(parseInt(todayStr.replace(/-/g, ''), 10));
    questions = seededShuffle(data, rnd).slice(0, DAILY_COUNT);
    questions.forEach(q => { q._answers = seededShuffle(q.answers, rnd); });

    showQuestion();
  } catch (e) {
    document.getElementById('loading').textContent = 'Today\'s challenge is not available right now.';
    console.error(e);
  }
}

function showQuestion() {
  document.getElementById('loading').hidden = true;
  document.getElementById('quizContent').hidden = false;
  document.getElementById('quizEnd').hidden = true;

  const q = questions[current];
  document.getElementById('qNum').textContent = current + 1;
  document.getElementById('qText').textContent = q.text_en || q.text;
  const qImg = document.getElementById('qImage');
  if (q.image_url) {
    qImg.hidden = false;
    qImg.innerHTML = `<img src="${q.image_url}" alt="">`;
  } else {
    qImg.hidden = true;
    qImg.innerHTML = '';
  }
  document.getElementById('progBar').style.width = (current / DAILY_COUNT * 100) + '%';
  const explain = document.getElementById('explain');
  explain.hidden = true;
  explain.classList.remove('visible');
  document.getElementById('nextRow').hidden = true;

  const answersDiv = document.getElementById('answers');
  const letters = ['A', 'B', 'C', 'D'];
  answersDiv.innerHTML = q._answers.map((a, i) => `
    <button class="answer" data-i="${i}" data-correct="${a.is_correct}">
      <span class="letter">${letters[i]}</span>
      <span>${a.text_en || a.text}</span>
    </button>
  `).join('');

  answersDiv.querySelectorAll('.answer').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(btn));
  });
}

function handleAnswer(btn) {
  const buttons = document.querySelectorAll('.answer');
  if (btn.disabled) return;
  buttons.forEach(b => b.disabled = true);

  const isCorrect = btn.dataset.correct === 'true';
  results[current] = isCorrect;
  let correctBtn = null;

  if (isCorrect) {
    btn.classList.add('correct');
    correctBtn = btn;
  } else {
    btn.classList.add('incorrect');
    buttons.forEach(b => {
      if (b.dataset.correct === 'true') {
        b.classList.add('reveal-correct');
        correctBtn = b;
      }
    });
  }

  const q = questions[current];

  if (correctBtn) {
    if (!isCorrect) {
      const wrongText = btn.querySelector('span:not(.letter)').textContent;
      const wrongDiv = document.createElement('div');
      wrongDiv.className = 'answer-wrong-recall';
      wrongDiv.innerHTML = '<span class="wrong-label">Your answer</span>' + wrongText;
      correctBtn.insertBefore(wrongDiv, correctBtn.querySelector('.letter').nextSibling);
    }
    const explanation = q.explanation_en || q.explanation;
    if (explanation) {
      const explainDiv = document.createElement('div');
      explainDiv.className = 'answer-explain';
      explainDiv.textContent = explanation;
      correctBtn.appendChild(explainDiv);
    }
  }

  setTimeout(() => {
    buttons.forEach(b => { if (b !== correctBtn) b.classList.add('fade-out'); });
    correctBtn.classList.add('expanded');
    setTimeout(() => {
      const inner = correctBtn.querySelector('.answer-explain');
      if (inner) inner.classList.add('show');
      document.getElementById('nextRow').hidden = false;
    }, 300);
  }, 500);

  document.getElementById('progBar').style.width = ((current + 1) / DAILY_COUNT * 100) + '%';
}

document.getElementById('nextBtn').addEventListener('click', () => {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    finish();
  }
});

function finish() {
  const score = results.filter(Boolean).length;
  const yesterday = parisDate(new Date(Date.now() - 86400000));
  const streak = (store.lastPlayed === yesterday) ? (store.streak || 0) + 1 : 1;
  const best = Math.max(store.best || 0, streak);

  // Rubies: awarded only once (here), not when re-rendering the locked result
  const correctQs = questions.filter((q, i) => results[i]);
  const rubisBefore = HQ.getRubis();
  const rubisGain = HQ.computeRubis(correctQs, DAILY_COUNT);
  const rubisTotal = HQ.addRubis(rubisGain);
  correctQs.forEach(q => { (q.theme_slugs || []).forEach(sl => HQ.recordMastery(sl, [q.id])); });

  writeStore({ ...store, lastPlayed: todayStr, streak, best, today: { date: todayStr, results, score, rubis: rubisGain } });
  saveScore(score);
  renderResult(score, streak, best, false, rubisGain, rubisBefore, rubisTotal);
}

function renderGrid() {
  document.getElementById('dailyGrid').innerHTML =
    results.map(r => `<span class="cell ${r ? 'ok' : 'no'}"></span>`).join('');
}
function shareGrid() {
  return results.map(r => r ? '■' : '□').join('');
}

function renderResult(score, streak, best, alreadyPlayed, rubisGain, rubisBefore, rubisTotal) {
  document.getElementById('loading').hidden = true;
  document.getElementById('quizContent').hidden = true;
  document.getElementById('quizEnd').hidden = false;
  document.getElementById('progBar').style.width = '100%';

  document.getElementById('resultEyebrow').textContent = 'Daily Challenge · ' + dateLabel;
  renderGrid();
  document.getElementById('finalScore').textContent = score;

  const pct = score / DAILY_COUNT;
  const label = pct >= 1 ? 'Flawless, hats off!' :
                pct >= 0.8 ? 'Sharp eye' :
                pct >= 0.6 ? 'Well played' :
                pct >= 0.4 ? 'Not bad' : 'Come back tomorrow to bounce back';
  document.getElementById('scoreLabel').textContent = label;

  if (typeof rubisGain === 'number') {
    revealRubis(rubisGain, rubisTotal);
    revealRank(rubisBefore, rubisTotal);
  }

  const streakEl = document.getElementById('dailyStreak');
  if (streak > 1) {
    streakEl.innerHTML = `Streak of <strong>${streak} days</strong>` + (best > streak ? ` · best ${best}` : '');
  } else {
    streakEl.innerHTML = `Come back tomorrow to start a streak`;
  }

  document.getElementById('streakBadge').hidden = false;
  document.getElementById('streakBadgeNum').textContent = streak;

  fetchAverage();
  startCountdown();
  showEmailCapture();

  document.getElementById('shareBtn').onclick = async () => {
    const text = `HOROQUEST · Daily Challenge ${dateLabel}\n${shareGrid()}\n${score}/${DAILY_COUNT} · Streak ${streak}\nhttps://horoquest.app/en/daily/`;
    if (navigator.share) {
      try { await navigator.share({ title: 'HOROQUEST', text }); } catch(e) {}
    } else {
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById('shareBtn');
        const old = btn.innerHTML;
        btn.innerHTML = 'Copied!';
        setTimeout(() => { btn.innerHTML = old; }, 1600);
      } catch(e) {}
    }
  };
}

async function saveScore(score) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        correct_count: score,
        total_questions: DAILY_COUNT,
        theme_slug: 'daily-' + todayStr,
        mode: 'daily',
        score: Math.round((score / DAILY_COUNT) * 100)
      })
    });
  } catch(e) {}
}

async function fetchAverage() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=correct_count,total_questions&theme_slug=eq.daily-${todayStr}`, { headers });
    const scores = await res.json();
    if (Array.isArray(scores) && scores.length > 0) {
      const avg = scores.reduce((s, x) => s + (x.correct_count / x.total_questions) * 100, 0) / scores.length;
      const n = scores.length;
      document.getElementById('resultAvg').textContent =
        `${n} enthusiast${n > 1 ? 's' : ''} took on today's challenge · ${avg.toFixed(0)}% average`;
    }
  } catch(e) {}
}

function parisSecondsOfDay() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date());
  const [h, m, s] = parts.split(':').map(Number);
  return h * 3600 + m * 60 + s;
}
function startCountdown() {
  const el = document.getElementById('countdown');
  function tick() {
    let rem = 86400 - parisSecondsOfDay();
    if (rem < 0) rem = 0;
    const h = String(Math.floor(rem / 3600)).padStart(2, '0');
    const m = String(Math.floor((rem % 3600) / 60)).padStart(2, '0');
    const s = String(rem % 60).padStart(2, '0');
    el.textContent = `${h}:${m}:${s}`;
    if (rem === 0) location.reload();
  }
  tick();
  setInterval(tick, 1000);
}

function revealRubis(gain, total) {
  const box = document.getElementById('rubisReveal');
  if (!box) return;
  box.hidden = false;
  const totalLine = document.getElementById('rubisTotalLine');
  if (totalLine) totalLine.textContent = 'Total ' + total.toLocaleString('en-US') + ' rubies';
  const gainEl = document.getElementById('rubisGain');
  const dur = 800, t0 = performance.now();
  (function tick(now) {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    gainEl.textContent = Math.round(eased * gain);
    if (p < 1) requestAnimationFrame(tick);
    else gainEl.textContent = gain;
  })(performance.now());
  const gem = box.querySelector('.rubis-gem');
  if (gem) { gem.innerHTML = HQ.gem; gem.classList.remove('sparkle'); void gem.offsetWidth; gem.classList.add('sparkle'); }
}

function revealRank(before, after) {
  const box = document.getElementById('rankReveal');
  if (!box) return;
  box.hidden = false;
  const info = HQ.rankInfo(after);
  const up = HQ.rankUp(before, after);
  const promo = document.getElementById('rankPromo');
  if (up) {
    box.classList.add('ranked-up');
    promo.hidden = false;
    promo.innerHTML = '<span class="rank-quote">' + up.line_en + '</span><span class="rank-by">Maître Horace</span>';
  } else {
    box.classList.remove('ranked-up');
    promo.hidden = true;
  }
  document.getElementById('rankNow').textContent = info.name_en;
  const fill = document.getElementById('rankBarFill');
  let pct;
  if (info.isMax) {
    document.getElementById('rankNext').textContent = 'Keeper of Time';
    document.getElementById('rankFoot').textContent = 'Top rank · the 20 hallmarks lead to Keeper of Time';
    pct = 100;
  } else {
    document.getElementById('rankNext').textContent = info.next_en;
    document.getElementById('rankFoot').textContent = info.toNext.toLocaleString('en-US') + ' rubies to ' + info.next_en;
    pct = Math.max(5, Math.round((after - info.min) / (info.nextMin - info.min) * 100));
  }
  requestAnimationFrame(function () { requestAnimationFrame(function () { fill.style.width = pct + '%'; }); });
}

function showEmailCapture() {
  if (ML_ACCOUNT === 'XXXXXX') return;          // not configured yet
  if (localStorage.getItem('hq_sub')) return;   // already subscribed
  const box = document.getElementById('emailCapture');
  if (box) box.hidden = false;
}

const emailForm = document.getElementById('emailForm');
if (emailForm) {
  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('emailInput');
    const btn = document.getElementById('emailSubmit');
    const note = document.getElementById('emailNote');
    const email = input.value.trim();
    if (!email || !email.includes('@')) { note.textContent = 'Enter a valid address.'; return; }
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const data = new FormData();
      data.append('fields[email]', email);
      data.append('ml-submit', '1');
      data.append('anticsrf', 'true');
      await fetch(`https://assets.mailerlite.com/jsonp/${ML_ACCOUNT}/forms/${ML_FORM}/subscribe`, { method: 'POST', body: data });
      localStorage.setItem('hq_sub', '1');
      document.querySelector('#emailCapture .email-capture-inner').innerHTML =
        '<div class="email-capture-success">All set. Check your inbox.</div>';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Sign me up';
      note.textContent = 'Something went wrong, try again.';
    }
  });
}

init();
</script>
</body>
</html>
