<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Défi du jour | HOROQUEST</title>
<link rel="stylesheet" href="../../assets/styles.css?v=2">
<style>
/* --- Défi du jour : styles spécifiques --- */
.daily-eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.streak-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; color: var(--ink);
  background: var(--card); border: 1px solid var(--border-strong);
  padding: 5px 12px; line-height: 1;
}
.streak-badge .flame { width: 15px; height: 15px; color: var(--accent); }
.daily-intro { text-align: center; padding: 8px 0 22px; }
.daily-intro h1 { font-size: clamp(26px, 6vw, 38px); margin: 6px 0 4px; }
.daily-intro p { color: var(--ink-soft); margin: 0; }

.daily-grid { display: flex; gap: 8px; justify-content: center; margin: 14px 0 18px; }
.daily-grid .cell { width: 34px; height: 34px; }
.daily-grid .cell.ok { background: var(--good); }
.daily-grid .cell.no { background: var(--accent); }
.daily-streak { color: var(--ink-soft); margin: 4px 0 2px; }
.daily-streak strong { color: var(--ink); }
.daily-next {
  margin: 24px auto 4px; max-width: 320px; text-align: center;
  border-top: 1px solid var(--border); padding-top: 20px;
}
.daily-countdown-label { font-size: 13px; color: var(--ink-soft); letter-spacing: .04em; }
.daily-countdown { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
.daily-locked-note { color: var(--ink-soft); font-size: 14px; margin: 4px 0 0; }
/* Centrage propre des actions de résultat (colonne centrée) */
#quizEnd .result-actions,
#quizEnd .result-buttons { justify-content: center; }
#quizEnd .result-actions { margin-bottom: 0; }
</style>
</head>
<body class="quiz-page">

<header class="quiz-header">
  <div class="container">
    <a class="quiz-back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Accueil</span>
    </a>
    <div class="streak-badge" id="streakBadge" hidden><svg class="flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><span id="streakBadgeNum">0</span></div>
    <a class="quiz-close" href="/" aria-label="Fermer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </a>
  </div>
  <div class="quiz-progress" aria-hidden="true"><div class="bar" id="progBar" style="width:0%;"></div></div>
</header>

<main class="quiz-main">
  <div class="container">

    <div id="loading" style="text-align:center;padding:60px 0;color:var(--ink-soft);">
      Préparation du défi du jour…
    </div>

    <div id="quizContent" hidden>
      <div class="q-num">Question <strong id="qNum">1</strong>/5</div>
      <h1 class="q-text" id="qText"></h1>
      <div class="q-image" id="qImage" hidden></div>
      <div class="answers" id="answers"></div>
      <div class="explain" id="explain" hidden></div>
      <div class="next-row" id="nextRow" hidden>
        <button class="btn btn-primary" id="nextBtn">Question suivante →</button>
      </div>
    </div>

    <div id="quizEnd" hidden>
      <div class="result-body" style="text-align:center;max-width:480px;margin:0 auto;padding-top:24px;">
        <div class="daily-eyebrow" id="resultEyebrow">Défi du jour</div>
        <div class="daily-grid" id="dailyGrid"></div>
        <div class="score"><span id="finalScore">0</span><span class="max">/5</span></div>
        <div class="score-label" id="scoreLabel"></div>
        <div class="daily-streak" id="dailyStreak"></div>
        <div class="result-avg" id="resultAvg"></div>
        <div class="result-actions">
          <button class="btn btn-primary result-share" id="shareBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            Partager mon résultat
          </button>
        </div>
        <div class="daily-next">
          <div class="daily-countdown-label">Nouveau défi dans</div>
          <div class="daily-countdown" id="countdown">--:--:--</div>
        </div>
        <div class="result-buttons" style="margin-top:18px;">
          <a href="/" class="btn btn-ghost">Jouer une collection</a>
        </div>
      </div>
    </div>

  </div>
</main>

<script>
const SUPABASE_URL = 'https://bqnawfnkukcbqkujsskr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxbmF3Zm5rdWtjYnFrdWpzc2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1ODQ5NDAsImV4cCI6MjA4NzE2MDk0MH0.VeSr_1gEnsn3P0_cmQBcOkJNDpUe1rbIAD8E7nSbxQM';
const headers = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

const DAILY_COUNT = 5;
const STORE_KEY = 'hq_daily';

// Date du jour en fuseau Paris, format YYYY-MM-DD (le même défi pour tout le monde)
function parisDate(d) {
  return new Intl.DateTimeFormat('fr-CA', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
}
const todayStr = parisDate();
const dateLabel = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', day: 'numeric', month: 'long' }).format(new Date());

// Générateur pseudo-aléatoire déterministe (même tirage pour une date donnée)
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rnd) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function readStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e) { return {}; } }
function writeStore(o) { try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch(e) {} }

let questions = [];
let current = 0;
let results = [];
const store = readStore();

// Badge de série dans le header
if (store.streak > 0 && store.lastPlayed) {
  const yesterday = parisDate(new Date(Date.now() - 86400000));
  if (store.lastPlayed === todayStr || store.lastPlayed === yesterday) {
    document.getElementById('streakBadge').hidden = false;
    document.getElementById('streakBadgeNum').textContent = store.streak;
  }
}

async function init() {
  // Déjà joué aujourd'hui : on affiche le résultat verrouillé
  if (store.today && store.today.date === todayStr) {
    results = store.today.results;
    renderResult(store.today.score, store.streak || 1, store.best || 1, true);
    return;
  }
  try {
    const url = `${SUPABASE_URL}/rest/v1/questions?select=id,text,explanation,difficulty,image_url,answers(id,text,is_correct)&order=id&limit=1000`;
    const res = await fetch(url, { headers });
    let data = await res.json();
    if (!Array.isArray(data)) throw new Error('Invalid response');
    data = data.filter(q => q.answers && q.answers.length === 4 && q.answers.some(a => a.is_correct));
    if (data.length < DAILY_COUNT) throw new Error('Pas assez de questions');

    const rnd = mulberry32(parseInt(todayStr.replace(/-/g, ''), 10));
    questions = seededShuffle(data, rnd).slice(0, DAILY_COUNT);
    questions.forEach(q => { q._answers = seededShuffle(q.answers, rnd); });

    showQuestion();
  } catch (e) {
    document.getElementById('loading').textContent = 'Le défi du jour n\'est pas disponible pour le moment.';
    console.error(e);
  }
}

function showQuestion() {
  document.getElementById('loading').hidden = true;
  document.getElementById('quizContent').hidden = false;
  document.getElementById('quizEnd').hidden = true;

  const q = questions[current];
  document.getElementById('qNum').textContent = current + 1;
  document.getElementById('qText').textContent = q.text;
  const qImg = document.getElementById('qImage');
  if (q.image_url) {
    qImg.hidden = false;
    qImg.innerHTML = `<img src="${q.image_url}" alt="">`;
  } else {
    qImg.hidden = true;
    qImg.innerHTML = '';
  }
  document.getElementById('progBar').style.width = (current / DAILY_COUNT * 100) + '%';
  const explain = document.getElementById('explain');
  explain.hidden = true;
  explain.classList.remove('visible');
  document.getElementById('nextRow').hidden = true;

  const answersDiv = document.getElementById('answers');
  const letters = ['A', 'B', 'C', 'D'];
  answersDiv.innerHTML = q._answers.map((a, i) => `
    <button class="answer" data-i="${i}" data-correct="${a.is_correct}">
      <span class="letter">${letters[i]}</span>
      <span>${a.text}</span>
    </button>
  `).join('');

  answersDiv.querySelectorAll('.answer').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(btn));
  });
}

function handleAnswer(btn) {
  const buttons = document.querySelectorAll('.answer');
  if (btn.disabled) return;
  buttons.forEach(b => b.disabled = true);

  const isCorrect = btn.dataset.correct === 'true';
  results[current] = isCorrect;
  let correctBtn = null;

  if (isCorrect) {
    btn.classList.add('correct');
    correctBtn = btn;
  } else {
    btn.classList.add('incorrect');
    buttons.forEach(b => {
      if (b.dataset.correct === 'true') {
        b.classList.add('reveal-correct');
        correctBtn = b;
      }
    });
  }

  const q = questions[current];

  if (correctBtn) {
    if (!isCorrect) {
      const wrongText = btn.querySelector('span:not(.letter)').textContent;
      const wrongDiv = document.createElement('div');
      wrongDiv.className = 'answer-wrong-recall';
      wrongDiv.innerHTML = '<span class="wrong-label">Ta réponse</span>' + wrongText;
      correctBtn.insertBefore(wrongDiv, correctBtn.querySelector('.letter').nextSibling);
    }
    if (q.explanation) {
      const explainDiv = document.createElement('div');
      explainDiv.className = 'answer-explain';
      explainDiv.textContent = q.explanation;
      correctBtn.appendChild(explainDiv);
    }
  }

  setTimeout(() => {
    buttons.forEach(b => { if (b !== correctBtn) b.classList.add('fade-out'); });
    correctBtn.classList.add('expanded');
    setTimeout(() => {
      const inner = correctBtn.querySelector('.answer-explain');
      if (inner) inner.classList.add('show');
      document.getElementById('nextRow').hidden = false;
    }, 300);
  }, 500);

  document.getElementById('progBar').style.width = ((current + 1) / DAILY_COUNT * 100) + '%';
}

document.getElementById('nextBtn').addEventListener('click', () => {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    finish();
  }
});

function finish() {
  const score = results.filter(Boolean).length;
  const yesterday = parisDate(new Date(Date.now() - 86400000));
  const streak = (store.lastPlayed === yesterday) ? (store.streak || 0) + 1 : 1;
  const best = Math.max(store.best || 0, streak);

  writeStore({ ...store, lastPlayed: todayStr, streak, best, today: { date: todayStr, results, score } });
  saveScore(score);
  renderResult(score, streak, best, false);
}

function renderGrid() {
  document.getElementById('dailyGrid').innerHTML =
    results.map(r => `<span class="cell ${r ? 'ok' : 'no'}"></span>`).join('');
}
function shareGrid() {
  return results.map(r => r ? '■' : '□').join('');
}

function renderResult(score, streak, best, alreadyPlayed) {
  document.getElementById('loading').hidden = true;
  document.getElementById('quizContent').hidden = true;
  document.getElementById('quizEnd').hidden = false;
  document.getElementById('progBar').style.width = '100%';

  document.getElementById('resultEyebrow').textContent = 'Défi du jour · ' + dateLabel;
  renderGrid();
  document.getElementById('finalScore').textContent = score;

  const pct = score / DAILY_COUNT;
  const label = pct >= 1 ? 'Sans-faute, chapeau !' :
                pct >= 0.8 ? 'L\'œil du connaisseur' :
                pct >= 0.6 ? 'Bien joué' :
                pct >= 0.4 ? 'Pas mal' : 'Reviens demain pour te rattraper';
  document.getElementById('scoreLabel').textContent = label;

  const streakEl = document.getElementById('dailyStreak');
  if (streak > 1) {
    streakEl.innerHTML = `Série de <strong>${streak} jours</strong>` + (best > streak ? ` · record ${best}` : '');
  } else {
    streakEl.innerHTML = `Reviens demain pour démarrer une série`;
  }

  document.getElementById('streakBadge').hidden = false;
  document.getElementById('streakBadgeNum').textContent = streak;

  fetchAverage();
  startCountdown();

  document.getElementById('shareBtn').onclick = async () => {
    const text = `HOROQUEST · Défi du jour ${dateLabel}\n${shareGrid()}\n${score}/${DAILY_COUNT} · Série ${streak}\nhttps://horoquest.app/fr/defi/`;
    if (navigator.share) {
      try { await navigator.share({ title: 'HOROQUEST', text }); } catch(e) {}
    } else {
      try {
        await navigator.clipboard.writeText(text);
        const span = document.getElementById('shareBtn').querySelector('span') || document.getElementById('shareBtn');
        // Le bouton contient un SVG + texte : on remplace juste le libellé
        const btn = document.getElementById('shareBtn');
        const old = btn.innerHTML;
        btn.innerHTML = 'Copié !';
        setTimeout(() => { btn.innerHTML = old; }, 1600);
      } catch(e) {}
    }
  };
}

async function saveScore(score) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        correct_count: score,
        total_questions: DAILY_COUNT,
        theme_slug: 'daily-' + todayStr,
        mode: 'daily',
        score: Math.round((score / DAILY_COUNT) * 100)
      })
    });
  } catch(e) {}
}

async function fetchAverage() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=correct_count,total_questions&theme_slug=eq.daily-${todayStr}`, { headers });
    const scores = await res.json();
    if (Array.isArray(scores) && scores.length > 0) {
      const avg = scores.reduce((s, x) => s + (x.correct_count / x.total_questions) * 100, 0) / scores.length;
      const n = scores.length;
      document.getElementById('resultAvg').textContent =
        `${n} passionné·e·s ont relevé le défi aujourd'hui · moyenne ${avg.toFixed(0)}%`;
    }
  } catch(e) {}
}

function parisSecondsOfDay() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date());
  const [h, m, s] = parts.split(':').map(Number);
  return h * 3600 + m * 60 + s;
}
function startCountdown() {
  const el = document.getElementById('countdown');
  function tick() {
    let rem = 86400 - parisSecondsOfDay();
    if (rem < 0) rem = 0;
    const h = String(Math.floor(rem / 3600)).padStart(2, '0');
    const m = String(Math.floor((rem % 3600) / 60)).padStart(2, '0');
    const s = String(rem % 60).padStart(2, '0');
    el.textContent = `${h}:${m}:${s}`;
    if (rem === 0) location.reload();
  }
  tick();
  setInterval(tick, 1000);
}

init();
</script>
</body>
</html>
